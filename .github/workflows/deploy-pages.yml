name: Publish visual preview

on:
  push:
    branches: [main]
    paths:
      - 'studio/public/**'
      - 'studio/data/content.seed.json'
      - 'studio/data/content.worlds.json'
      - 'studio/scripts/build-content.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare and verify static preview
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R studio/public/. _site/
          rm -rf _site/admin
          touch _site/.nojekyll

          node studio/scripts/build-content.mjs \
            studio/data/content.seed.json \
            studio/data/content.worlds.json \
            _site/content.json

          printf '{"commit":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > _site/build-info.json

          test -f _site/residents.html
          test -f _site/chronicle.html
          test -f _site/assets/css/site-fixes.css
          test -f _site/assets/js/site-enhancements.js
          test -f _site/content.json
          grep -q 'site-fixes.css?v=20260804b' _site/residents.html
          grep -q 'site-enhancements.js?v=20260804b' _site/chronicle.html
          grep -q '/media/residents/sirin/cinematic.avif' _site/content.json
          grep -q '/media/residents/nutcracker/studio.webp' _site/content.json
          grep -q '"showcase": false' _site/content.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
