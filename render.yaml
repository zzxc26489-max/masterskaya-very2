services:
  - type: web
    name: masterskaya-very-preview
    runtime: node
    rootDir: studio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/content
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
